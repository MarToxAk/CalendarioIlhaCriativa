# ============================================================================
# Stack Portainer — Calendário Ilha Criativa
# ============================================================================
# Deploy no Portainer via "Stacks" -> "Add stack" -> "Repository":
#   - Repository URL: este repo (branch main)
#   - Compose path:   docker-compose.yml
#   - Este modo faz o CLONE do repo no host, então `build: .` e os bind mounts
#     relativos (./deploy/Caddyfile) funcionam. O modo "Web editor" NÃO funciona
#     (sem contexto de build / sem os arquivos do repo).
#
# Variáveis de ambiente — preencher na aba "Environment variables" do stack
# (Portainer as injeta na substituição ${...} abaixo). NENHUMA vai versionada.
#   Obrigatórias:
#     POSTGRES_PASSWORD
#     RAILS_MASTER_KEY
#     CORS_ORIGINS                                  (ex.: https://ilhacriativa.autopyweb.com.br)
#     EVOLUTION_BASE_URL                            (https://...)
#     EVOLUTION_GLOBAL_API_KEY
#     EVOLUTION_WEBHOOK_HMAC_KEY
#     EVOLUTION_WEBHOOK_BASE_URL                    (https://...)
#     S3_ENDPOINT                                   (https://...)
#     AWS_ACCESS_KEY_ID
#     AWS_SECRET_ACCESS_KEY
#     ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
#     ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
#     ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
#   Opcionais:
#     AWS_REGION                                    (default us-east-1)
#
# O boot em produção é fail-fast: falta de qualquer obrigatória derruba o
# serviço com mensagem clara (config/initializers/evolution.rb + application.rb).
# `restart: unless-stopped` faz o Portainer re-subir — corrija a env e faça
# "Update the stack" / "Re-pull and redeploy".
# ============================================================================
name: calendario-livia

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: calendario_livia_production
      POSTGRES_USER: calendario_livia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # IN-05 — mesmo wall-clock de web/jobs: com config.active_record.default_timezone = :local,
      # defaults SQL (CURRENT_TIMESTAMP / now()) tem que bater com o relogio do app. NAO e migrar
      # para :utc (Out of Scope) — so remove a divergencia de relogio. Ver 25-REVIEW.md IN-05.
      TZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendario_livia"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      # WR-02 — bind em loopback: sem TLS nessa porta e com config.assume_ssl=true, expor em
      # 0.0.0.0 serviria trafego de sessao/auth em cleartext p/ quem alcance o host. Ingresso
      # publico e SO pelo proxy (Caddy) nas portas 80/443. Ver 25-REVIEW.md WR-02.
      - "127.0.0.1:5881:3000"
    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      POSTGRES_HOST: db
      POSTGRES_USER: calendario_livia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CALENDARIO_LIVIA_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      RAILS_LOG_TO_STDOUT: "true"
      WEB_CONCURRENCY: 2
      # CR-02 — config/application.rb faz ENV.fetch("CORS_ORIGINS") sem default em producao;
      # a ausencia levanta KeyError e o servico entra em crash-loop (restart: unless-stopped).
      # O valor (uma origin publica, nao segredo) vem do .env do host. Ver 25-REVIEW.md CR-02.
      CORS_ORIGINS: ${CORS_ORIGINS}
      # INFRA-03 — timezone_check.rb aborta o boot em producao se TZ != America/Sao_Paulo
      # (config.active_record.default_timezone = :local exige TZ fixo). Ver 25-RESEARCH.md Pattern 4 / Pitfall 5.
      TZ: America/Sao_Paulo
      # Config env-driven (sem fallback para credentials.yml.enc). Boot-fatal em producao se
      # faltar (config/initializers/evolution.rb). Valores no .env do host. Ver .env.example.
      # --- Evolution API (transporte WhatsApp) ---
      EVOLUTION_BASE_URL: ${EVOLUTION_BASE_URL}
      EVOLUTION_GLOBAL_API_KEY: ${EVOLUTION_GLOBAL_API_KEY}
      EVOLUTION_WEBHOOK_HMAC_KEY: ${EVOLUTION_WEBHOOK_HMAC_KEY}
      EVOLUTION_WEBHOOK_BASE_URL: ${EVOLUTION_WEBHOOK_BASE_URL}
      # --- Object storage (MinIO / S3-compativel) — INFRA-01 ---
      S3_ENDPOINT: ${S3_ENDPOINT}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      # --- active_record_encryption (encrypts :token em whatsapp_instances) ---
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY}
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY}
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT}
    volumes:
      - storage:/rails/storage
    # WR-03 / IN-07 — /up esta excluido do force-redirect (config.ssl_options, 25-03), entao
    # responde 200 em HTTP interno; curl esta no runtime da imagem. jobs e proxy so sobem
    # depois deste healthcheck passar. Ver 25-REVIEW.md WR-03 / IN-07.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # solid_queue worker dedicado. Sem este servico NENHUM job agendado dispara em producao
  # (o SOLID_QUEUE_IN_PUMA vive no config/deploy.yml do Kamal, que NAO e o caminho de deploy
  # escolhido no Task 1 do 25-03-PLAN: docker compose). Reusa a mesma imagem do web com o
  # command sobrescrito e NAO roda db:prepare (o web e dono das migracoes via bin/docker-entrypoint,
  # que so dispara db:prepare quando o comando termina em "./bin/rails server"). Ver 25-RESEARCH.md Pitfall 5.
  jobs:
    build: .
    command: ["./bin/jobs"]
    depends_on:
      db:
        condition: service_healthy
      # WR-03 / IN-07 — jobs roda ./bin/jobs e consulta solid_queue_* na hora; so subir
      # depois de web migrar via db:prepare no entrypoint (web e dono das migracoes).
      web:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      POSTGRES_HOST: db
      POSTGRES_USER: calendario_livia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CALENDARIO_LIVIA_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      RAILS_LOG_TO_STDOUT: "true"
      # CR-02 — mesma exigencia do web: CORS_ORIGINS sem default em producao (KeyError -> crash-loop).
      CORS_ORIGINS: ${CORS_ORIGINS}
      # INFRA-03 — TZ tem que estar nos DOIS servicos (web + jobs) ou o timezone_check.rb
      # aborta o boot de quem faltar. Jobs agendados usam o wall-clock local (America/Sao_Paulo).
      TZ: America/Sao_Paulo
      # Config env-driven — MESMO conjunto do web (o job de envio usa Evolution + S3 + encrypts :token).
      # --- Evolution API (transporte WhatsApp) ---
      EVOLUTION_BASE_URL: ${EVOLUTION_BASE_URL}
      EVOLUTION_GLOBAL_API_KEY: ${EVOLUTION_GLOBAL_API_KEY}
      EVOLUTION_WEBHOOK_HMAC_KEY: ${EVOLUTION_WEBHOOK_HMAC_KEY}
      EVOLUTION_WEBHOOK_BASE_URL: ${EVOLUTION_WEBHOOK_BASE_URL}
      # --- Object storage (MinIO / S3-compativel) — INFRA-01 ---
      S3_ENDPOINT: ${S3_ENDPOINT}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      # --- active_record_encryption (encrypts :token em whatsapp_instances) ---
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY}
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY}
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT}
    volumes:
      - storage:/rails/storage
    restart: unless-stopped

  # Reverse proxy — termina TLS (Let's Encrypt automatico quando as portas 80/443 do host
  # estao acessiveis pela internet) e encaminha para o web. CONTEXT.md D-09 (app no host publico) /
  # D-11 (co-locado com Evolution + MinIO — risco de co-locacao aceito conscientemente, threat T-25-13).
  # Ver 25-RESEARCH.md Pitfall 5.
  #
  # O MinIO NAO e proxied aqui: nesta instalacao ele ja esta live e TLS-terminado em outra infra
  # (endpoint externo em config/credentials.yml.enc -> aws.endpoint). O app o alcanca como servico
  # HTTPS externo; nao ha container MinIO co-locado. Ver deploy/Caddyfile e 25-03-SUMMARY.md
  # "Topology deviation" (Deviation Rule 2 — a premissa do plano de um bloco s3. proxied nao vale aqui).
  proxy:
    image: caddy:2-alpine
    depends_on:
      # IN-07 — o Caddy nao devolve 502 enquanto o Rails ainda boota.
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  postgres_data:
  storage:
  caddy_data:
  caddy_config:
