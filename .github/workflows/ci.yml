name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v5
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
          # Config env-driven (sem fallback pro credentials.yml.enc) — valores dummy
          # só para os testes bootarem/stubarem o Evolution::Client. Nenhum é segredo real.
          EVOLUTION_BASE_URL: https://evolution.test.invalid
          EVOLUTION_GLOBAL_API_KEY: ci-dummy-evolution-key
          EVOLUTION_WEBHOOK_HMAC_KEY: ci-dummy-webhook-hmac-key
          EVOLUTION_WEBHOOK_BASE_URL: https://webhook.test.invalid
          S3_ENDPOINT: https://s3.test.invalid
          AWS_ACCESS_KEY_ID: ci-dummy
          AWS_SECRET_ACCESS_KEY: ci-dummy-secret
          AWS_REGION: us-east-1
          ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: 000102030405060708090a0b0c0d0e0f
          ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: 0f0e0d0c0b0a09080706050403020100
          ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: 0011223344556677889900aa
        run: bin/rails db:test:prepare test

  system-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run System Tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
          # Config env-driven (sem fallback pro credentials.yml.enc) — valores dummy
          # só para os testes bootarem/stubarem o Evolution::Client. Nenhum é segredo real.
          EVOLUTION_BASE_URL: https://evolution.test.invalid
          EVOLUTION_GLOBAL_API_KEY: ci-dummy-evolution-key
          EVOLUTION_WEBHOOK_HMAC_KEY: ci-dummy-webhook-hmac-key
          EVOLUTION_WEBHOOK_BASE_URL: https://webhook.test.invalid
          S3_ENDPOINT: https://s3.test.invalid
          AWS_ACCESS_KEY_ID: ci-dummy
          AWS_SECRET_ACCESS_KEY: ci-dummy-secret
          AWS_REGION: us-east-1
          ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: 000102030405060708090a0b0c0d0e0f
          ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: 0f0e0d0c0b0a09080706050403020100
          ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: 0011223344556677889900aa
        run: bin/rails db:test:prepare test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
