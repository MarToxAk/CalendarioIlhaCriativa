test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# ActiveStorage S3/MinIO — INFRA-01 (25-RESEARCH.md Pattern 5; CONTEXT D-01/D-02/D-03)
# Bucket privado por ambiente (D-03); a presigned GET com expires_in explícito é gerada por
# chamada dentro do job de envio (D-02). O serviço fica privado (sem a chave de acesso público);
# um object store público exporia toda arte ainda não divulgada na internet.
# Endpoint MinIO self-hosted + force_path_style (MinIO não faz virtual-host-style buckets por padrão).
# Segredos: S3_ENDPOINT via ENV (.env em dev / credentials em prod); aws.* em config/credentials.yml.enc.
amazon:
  service: S3
  endpoint: <%= ENV.fetch("S3_ENDPOINT") { Rails.application.credentials.dig(:aws, :endpoint) } %>
  access_key_id: <%= Rails.application.credentials.dig(:aws, :access_key_id) %>
  secret_access_key: <%= Rails.application.credentials.dig(:aws, :secret_access_key) %>
  region: <%= Rails.application.credentials.dig(:aws, :region) || "us-east-1" %>
  bucket: <%= "calendario-livia-#{Rails.env}" %>
  force_path_style: true

# Remember not to checkin your GCS keyfile to a repository
# google:
#   service: GCS
#   project: your_project
#   credentials: <%= Rails.root.join("path/to/gcs.keyfile") %>
#   bucket: your_own_bucket-<%= Rails.env %>

