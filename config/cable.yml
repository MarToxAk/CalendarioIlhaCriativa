# development usa solid_cable (nao async) desde a fase 30 (ACOMP-01): o async adapter so
# entrega broadcasts dentro do MESMO processo, e o bin/jobs (Procfile.dev) roda em processo
# separado do bin/rails server. Sem solid_cable, um broadcast disparado por um job (ex.
# Whatsapp::SendToGroupJob) nunca chegaria ao navegador conectado ao processo web. Base unica
# de dev (mesmo tratamento ja dado ao solid_queue) — sem bloco connects_to.
development:
  adapter: solid_cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
